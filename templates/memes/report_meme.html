{% extends 'base.html' %}

{% block title %}Пожаловаться на мем - Memeow{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-flag"></i> Пожаловаться на мем</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3 text-center">
                        <img src="{{ meme.image.url }}" alt="{{ meme.title }}" 
                             class="img-fluid rounded" style="max-height: 200px; padding-left: 35%; padding-right: 35%;">
                        <p class="mt-2"><strong>{{ meme.title }}</strong></p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Причина жалобы *</label>
                            <select name="reason" class="form-control" required>
                                <option value="">Выберите причину</option>
                                <option value="spam">Спам</option>
                                <option value="offensive">Оскорбительный контент</option>
                                <option value="copyright">Нарушение авторских прав</option>
                                <option value="violence">Насилие</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Описание проблемы</label>
                            <textarea name="description" class="form-control" rows="4" 
                                      placeholder="Опишите проблему подробнее..."></textarea>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            Ваша жалоба будет рассмотрена модератором. Автор мема будет уведомлен о жалобе.
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-report">Отправить жалобу</button>
                            <a href="{% url 'meme_detail' meme.id %}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
